<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encoder & Decoder</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>the <span class="six">6</span><span class="seven">7</span> Encoder & Decoder</h1>

        <label for="input-text">Input</label>
        <textarea id="input-text" placeholder="Enter your text here..."></textarea>

        <div class="buttons">
            <button id="encode-button" type="button">Encode</button>
            <button id="swap-button" type="button">Swap ⇅</button>
            <button id="decode-button" type="button">Decode</button>
        </div>

        <label for="output-text">Output</label>
        <textarea id="output-text" placeholder="Your result will appear here..." readonly></textarea>
        <button id="copy-button" type="button">Copy output</button>
    </main>
</body>

</html>
